[shell]
history.ignore = [
  "ls",
  "ls -*",
  "ll",
  "cd -",
  "pwd",
  "exit",
  "date",
  "clear",
  "history*",
  "id",
  "sudo su",
  "sudo su -",
  "bg",
  "fg"
]
less_options = [
  "--autosave=/",
	"--chop-long-lines",
	"--clear-screen",
	"--ignore-case",
	"--jump-target=10",
	"--LONG-PROMPT",
	"--RAW-CONTROL-CHARS",
	"--shift=5",
	"--status-column",
	"--tabs=2",
	"--tilde",
  "--use-color",
]

[shell.aliases]
ll = "ls -alF"
".." = "cd .."
"..." = "cd ../.."
mv = "mv -iv"
mkdir = "mkdir -pv"
grep = "grep --color=auto"
utc = "TZ=UTC date --iso-8601=seconds -d"

[shell.bash]
history.time_format = "%Y-%m-%d %T"

[shell.zsh]
pacman_cache = "/var/cache/zsh/pacman"
