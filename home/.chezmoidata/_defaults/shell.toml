[shell]
pager = "moor"
editor = "vim"
history.ignore = [
  "ls",
  "ls -*",
  "ll",
  "cd -",
  "pwd",
  "exit",
  "date",
  "clear",
  "history*",
  "id",
  "sudo su",
  "sudo su -",
  "bg",
  "fg"
]
less_options = [
  "--autosave=/",         # Save searches to history as you make them.
  "--chop-long-lines",    # Keep long lines unwrapped; scroll sideways to read them.
  "--clear-screen",
  "--ignore-case",
  "--jump-target=10",     # Put a search result 10 lines from the top, leaving context above it.
  "--LONG-PROMPT",        # Show the file name and position in the prompt.
  "--RAW-CONTROL-CHARS",  # Let colors in command output show through.
  "--shift=5",            # Move sideways 5 columns at a time.
  "--status-column",      # Show a marker strip at the left of the text.
  "--tabs=2",             # Set tabs every 2 columns.
  "--tilde",              # Leave the area below the file blank instead of showing ~.
  "--use-color",
]

[shell.aliases]
ll = "ls -alF"
".." = "cd .."
"..." = "cd ../.."
mv = "mv -iv"
mkdir = "mkdir -pv"
grep = "grep --color=auto"
utc = "TZ=UTC date --iso-8601=seconds -d"

[shell.bash]
history.time_format = "%Y-%m-%d %T"

[shell.zsh]
pacman_cache = "/var/cache/zsh/pacman"
